# for gitee
kind: pipeline
type: docker
name: eladmin-web-tmp-ci/cd

workspace:
  path: /drone/src

clone:
  depth: 1
  disable: false

steps:
  - name: restore-cache
    image: drillster/drone-volume-cache
    volumes:
    - name: cache_node_module_dir
      path: /cache
    settings:
      restore: true
      mount:
        - ./node_modules
  - name: build
#     image: node:12.22.6
      image: node:16.20.2
    environment:
      KEY_A: value_a
      TZ: Asia/Shanghai
      LANG: en_US.utf8
    volumes:
      - name: workbench_dir
        path: /root/workbench_dir # path in the container
    commands:
      # use 内置变量 https://docs.drone.io/pipeline/environment/reference/
      - echo ${DRONE_GIT_HTTP_URL} ${DRONE_COMMIT_BRANCH} ${DRONE_BUILD_LINK}
      # echo 后面的字符串中不能有英文冒号，
      - echo "url=${DRONE_GIT_HTTP_URL}, branch=${DRONE_COMMIT_BRANCH}, buildUrl=${DRONE_BUILD_LINK}"
      - env
      # - npm i
      - npm i --registry=https://registry.npmmirror.com
      - npm run build:prod
      - mkdir -p /root/workbench_dir/nginx-static/eladmin_tmp_static
      - rm -rf /root/workbench_dir/nginx-static/eladmin_tmp_static/*
      - cp -r /drone/src/dist/* /root/workbench_dir/nginx-static/eladmin_tmp_static
  - name: rebuild-cache
    image: drillster/drone-volume-cache
    volumes:
    - name: cache_node_module_dir
      path: /cache
    settings:
      rebuild: true
      mount:
        - ./node_modules

trigger:
  branch:
    - master
    - dev
    - dev-quarkus3
  event:
    - push
    - custom

volumes:
  - name: workbench_dir
    host:
      path: /opt/workbench
  - name: cache_node_module_dir
    host: 
      path: /tmp/node-module-cache-eladmin-tmp-web
